spring.config.import=optional:file:.env[.properties]

spring.application.name=auth-server

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
verification.token.expiration-hours=${VERIFICATION_TOKEN_EXPIRATION_HOURS}
password.reset.token.expiration-hours=${PASSWORD_RESET_TOKEN_EXPIRATION_HOURS}
jwt.access-token.expiration-hours=${JWT_ACCESS_TOKEN_EXPIRATION_HOURS}
refresh.token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS}